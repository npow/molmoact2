[project]
name = "molmoact2-policy-server"
version = "0.1.1"
description = "MolmoAct2 inference server (FastAPI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers>=4.57,<4.58",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface-hub[cli]>=0.36",
    "hf-transfer>=0.1.8",
    "pillow>=10",
    "numpy>=1.26,<3",
    "einops>=0.7",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "json-numpy>=2.1.0",
    "prometheus-client>=0.21",
    "tyro>=1.0.13",
    "imageio>=2.37.3",
    "servo-client>=0.7.18",
]

[project.optional-dependencies]
# ManiSkill simulation stack (sim_eval/). Its mplib/sapien wheels are
# x86_64-only, so it is kept out of the base install to let the robot-side
# aarch64 machines (Jetson) sync. On an x86 sim box: `uv sync --extra sim`.
sim = [
    "mani-skill>=3.0.1",
    "transforms3d>=0.4.2",
    "gymnasium>=1.3.0",
]

# Robot-side closed-loop runtime (examples/yam). Mirrors the PyPI-installable
# half of examples/yam/requirements.txt. Not included: pyrealsense2 on aarch64
# (no PyPI wheel for this arch -- build locally on Jetson) and lerobot.
robot = [
    "opencv-python>=4.10",
    "h5py>=3.11",
    "omegaconf>=2.3",
    "pyzmq>=26",
    "tqdm>=4.66",
    "rerun-sdk==0.35.0",
    "i2rt",
    "pyrealsense2; platform_machine == 'x86_64'",
]

[tool.uv.sources]
# CUDA-12.1 wheels exist only for x86_64/Windows. On aarch64 (Jetson) fall
# through to PyPI, which ships manylinux aarch64 builds of the same versions.
torch = [{ index = "pytorch-cu121", marker = "platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu121", marker = "platform_machine == 'x86_64'" }]
i2rt = { git = "https://github.com/npow/i2rt.git", rev = "codex/yam-reliability-checkpoint" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
