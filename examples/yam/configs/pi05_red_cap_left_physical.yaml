# Primary physical config for the 7-D YAM pi0.5 red-cap endpoint.
#
# The endpoint is a native single-arm policy. The client sends fields 0:7 from
# live [left(7), right(7)] feedback, then places the returned 7-D actions back
# into fields 0:7. The launcher's hold mask keeps the right arm at live feedback.
# Gripper values stay in the YAM convention used during collection:
# 0 = closed, 1 = open. Do not invert them here; OpenPI owns that transform.
model_arm_side: left

sensors:
  cameras:
    left_camera:
      device_id: "/dev/yam-cameras/left"
    front_camera:
      device_id: "/dev/yam-cameras/middle"
    right_camera:
      device_id: "/dev/yam-cameras/right"

robot:
  _target_: gello_min.yam.YAMRobot
  channel: can_left

agent:
  start_joints: null

hz: 15
max_steps: 600

storage:
  base_dir: "./yam_eval_runs"
  task_directory: "pi05_red_cap_full_7500_left"
  language_instruction: "pick up the red cap and place it in the black box"
  saver_max_workers: 2
  png_compress_level: 1

lerobot:
  fps: 15
  robot_type: "pi05_yam_single_left"
  hf_repo_id: "local/yam_eval_session"
  action_mode: "next_joint_fields"
  vcodec: "libx264"
  image_writer_processes: 2
  image_writer_threads: 2
  parallel_encoding: false
  sanitize_online_viz_meta: true

eval:
  bimanual:
    active_arm_side: left
    execution_mode: shadow
    both_arm_max_delta: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.025, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.025]
  live_view_enabled: false
  return_to_rest_on_exit: true
  return_to_rest_max_joint_step: 0.01
  reproducibility:
    seed: 20260911
    deterministic_algorithms: false
  camera_preflight:
    enabled: true
    timeout_sec: 10
    min_warmup_sec: 2.0
    required_consecutive_frames: 2
    expected_shape: [480, 640, 3]
    max_clipped_white_fraction: 0.15
  rerun:
    enabled: true
    image_stride: 3
    jpeg_quality: 75
    action_chunk_size: 15
  mode: direct
  direct:
    grant: "~/.config/servo/pi05-yam-full-7500-grant.json"
    servo_python: "/home/npow/code/servo-yam-redcap/.venv/bin/python"
    single_arm_side: left
    jpeg_quality: 85
    image_size: null
    image_fit: pad
    observation_encoding: jpeg
  camera_server:
    enabled: false
